<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhishShield</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 0;
    }

    .container {
      padding: 1.5rem;
      background: white;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 1.5rem;
      border-bottom: 2px solid #f0f0f0;
      padding-bottom: 1rem;
    }

    h1 {
      font-size: 1.5rem;
      color: #1f2937;
      margin-bottom: 0.25rem;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #666;
    }

    .content {
      margin-bottom: 1rem;
    }

    .section {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
      color: #374151;
      font-size: 0.9rem;
    }

    textarea {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #e5e7eb;
      border-radius: 0.375rem;
      font-family: inherit;
      font-size: 0.9rem;
      resize: vertical;
      min-height: 80px;
    }

    textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .input-group {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    button {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 0.375rem;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.9rem;
      transition: all 0.3s;
    }

    .primary-btn {
      background: #667eea;
      color: white;
      flex: 1;
    }

    .primary-btn:hover {
      background: #5568d3;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }

    .primary-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .secondary-btn {
      background: #f0f0f0;
      color: #374151;
      flex: 1;
    }

    .secondary-btn:hover {
      background: #e5e5e5;
    }

    .url-info {
      padding: 0.75rem;
      background: #f0f4ff;
      border-radius: 0.375rem;
      border-left: 3px solid #667eea;
      margin-bottom: 0.5rem;
      font-size: 0.85rem;
    }

    .url-info strong {
      display: block;
      color: #667eea;
      margin-bottom: 0.25rem;
    }

    .url-info p {
      color: #666;
      word-break: break-all;
      margin: 0;
    }

    #result {
      margin-top: 1rem;
      padding: 1rem;
      border-radius: 0.5rem;
      display: none;
    }

    #result.show {
      display: block;
    }

    #result.safe {
      background: #d1fae5;
      border-left: 4px solid #10b981;
      color: #065f46;
    }

    #result.suspicious {
      background: #fef3c7;
      border-left: 4px solid #f59e0b;
      color: #78350f;
    }

    #result.danger {
      background: #fee2e2;
      border-left: 4px solid #dc2626;
      color: #7f1d1d;
    }

    #result h3 {
      margin-bottom: 0.5rem;
      font-size: 1rem;
    }

    #result p {
      font-size: 0.9rem;
      margin-bottom: 0.25rem;
    }

    .loading {
      text-align: center;
      padding: 1rem;
      display: none;
    }

    .loading.show {
      display: block;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #f0f0f0;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error {
      color: #dc2626;
      font-size: 0.85rem;
      margin-top: 0.5rem;
      display: none;
    }

    .error.show {
      display: block;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 2px solid #f0f0f0;
    }

    .stat {
      text-align: center;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: bold;
      color: #667eea;
    }

    .stat-label {
      font-size: 0.75rem;
      color: #666;
      margin-top: 0.25rem;
    }

    .tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
      border-bottom: 2px solid #e5e7eb;
    }

    .tab {
      padding: 0.5rem 1rem;
      background: none;
      border: none;
      color: #999;
      cursor: pointer;
      font-weight: 500;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
    }

    .tab.active {
      color: #667eea;
      border-bottom-color: #667eea;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🛡️ PhishShield</h1>
      <p class="subtitle">Real-time Phishing Detection</p>
    </header>

    <div class="content">
      <div class="tabs">
        <button class="tab active" onclick="switchTab('url')">URL Check</button>
        <button class="tab" onclick="switchTab('email')">Email Check</button>
      </div>

      <div id="url-section" class="section">
        <div class="url-info">
          <strong>Current URL:</strong>
          <p id="current-url">Loading...</p>
        </div>
        <button class="primary-btn" onclick="analyzeCurrentURL()">Check Current URL</button>
      </div>

      <div id="email-section" class="section" style="display: none;">
        <label>Paste suspicious email or text:</label>
        <textarea id="email-input" placeholder="Paste email content or text here..."></textarea>
        <button class="primary-btn" onclick="analyzeEmail()">Analyze Email</button>
      </div>

      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p style="margin-top: 0.5rem; font-size: 0.9rem; color: #666;">Analyzing...</p>
      </div>

      <div class="error" id="error"></div>

      <div id="result"></div>

      <div class="stats" id="stats" style="display: none;">
        <div class="stat">
          <div class="stat-label">Total Scans</div>
          <div class="stat-value" id="stat-total">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">This Session</div>
          <div class="stat-value" id="stat-session">0</div>
        </div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
